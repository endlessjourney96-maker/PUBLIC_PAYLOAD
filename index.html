<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>仕事改善診断｜3問で次の一手</title><style>:root{--ink:#10223a;--muted:#5d6b7d;--line:#dfe7f1;--brand:#5b5cf0;--soft:#f4f7ff}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;max-width:920px;margin:auto;padding:28px 18px 56px;background:linear-gradient(180deg,#f7f8ff,#f8fafc);color:var(--ink)}.hero{padding:26px 4px 14px}.eyebrow,.tag{display:inline-block;padding:6px 10px;border-radius:999px;background:#ebeaff;color:#4546c7;font-weight:800;font-size:12px}.hero h1{font-size:clamp(34px,6vw,56px);line-height:1.08;margin:14px 0}.lead{font-size:18px;line-height:1.75;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:26px;margin:18px 0;box-shadow:0 18px 50px #202d4b14}label{display:block;margin:18px 0 8px;font-weight:800}select,button{width:100%;padding:15px;border-radius:14px;font-size:16px}select{border:1px solid #cfd9e7;background:#fff}button{border:0;margin-top:22px;background:linear-gradient(100deg,var(--brand),#7068ef);color:#fff;font-weight:900;cursor:pointer}.micro,.muted{color:var(--muted)}.micro{font-size:12px;text-align:center}.result{display:none}.result h2{font-size:30px}.rec{border-top:1px solid var(--line);padding:16px 0}.decision{padding:16px;border-radius:16px;background:var(--soft);font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pill{padding:10px 12px;border:1px solid var(--line);border-radius:14px;font-size:13px}@media(max-width:620px){body{padding:20px 13px}.card{padding:20px}.grid{grid-template-columns:1fr}.lead{font-size:16px}}</style></head><body><header class='hero'><span class='eyebrow'>WORK IMPROVEMENT ENGINE</span><h1>あなたの職種ではなく、<br>仕事の「詰まり」から考える。</h1><p class='lead'>3問で仕事の構造を整理。まず0円改善、それでも足りない時だけAI・SaaS・道具・支援を比較します。「何も買わない」も正解です。</p><div class='grid'><div class='pill'>✓ 職種を限定しない</div><div class='pill'>✓ 報酬額で順位を変えない</div><div class='pill'>✓ 無料改善を先に提示</div><div class='pill'>✓ 買わない判断も提示</div></div></header><main><section class='card' id='form'><h2>3問で診断</h2><label for='pattern'>① いちばん時間・手間を取られている仕事</label><select id='pattern'><option value='information'>情報を探す・整理する</option><option value='writing'>文章・資料・報告を作る</option><option value='coordination'>連絡・調整・予約</option><option value='numbers'>数字・Excel・集計</option><option value='repetition'>入力・転記・確認の繰り返し</option><option value='customer'>接客・営業・顧客対応</option><option value='field'>現場作業・移動・立ち仕事</option><option value='teaching'>教育・育成・引き継ぎ</option><option value='creative'>制作・デザイン・動画</option><option value='technical'>開発・IT運用・技術作業</option><option value='management'>管理・意思決定・マネジメント</option><option value='other'>うまく言語化できない</option></select><label for='context'>② 仕事に近い領域（補助情報）</label><select id='context'><option>経営・管理</option><option>企画・事務</option><option>営業・接客</option><option>教育・支援</option><option>クリエイティブ</option><option>IT・開発</option><option>現場・物流・製造</option><option>その他</option></select><label for='budget'>③ 追加予算</label><select id='budget'><option value='zero'>0円で改善したい</option><option value='low'>月3,000円程度まで</option><option value='mid'>月10,000円程度まで</option></select><button id='diagnose'>無料で改善案を見る →</button><p class='micro'>個人情報は入力しません。診断カテゴリのみ匿名の改善計測に利用する場合があります。</p></section><section class='card result' id='result' tabindex='-1' aria-live='polite'><span class='tag' id='patternTag'></span><h2>まず、0円で変える。</h2><div class='decision' id='free'></div><div id='recommendations'></div><p class='muted' id='policy'></p><button id='reset'>← 条件を変える</button></section></main><script src='src/work-pattern-engine.js'></script><script>const patterns={information:{id:'information',label:'情報を探す・整理する',free_first:'情報の置き場所を1つ決め、探す前に検索語と欲しい答えを1行で固定する',solution_tags:['knowledge','search','ai']},writing:{id:'writing',label:'文章・資料・報告',free_first:'目的・材料・任せる範囲の3点をテンプレ化する',solution_tags:['writing','template','ai']},coordination:{id:'coordination',label:'連絡・調整・予約',free_first:'依頼文を目的・期限・相手の次アクションの3点に統一する',solution_tags:['calendar','communication','automation']},numbers:{id:'numbers',label:'数字・Excel・集計',free_first:'入力・計算・確認を分離し、繰り返し手順を1本だけテンプレ化する',solution_tags:['spreadsheet','automation','ai']},repetition:{id:'repetition',label:'反復・転記',free_first:'繰り返し作業を記録し、最も回数が多い1工程だけ先に削る',solution_tags:['automation','integration','rpa']},customer:{id:'customer',label:'接客・営業・顧客対応',free_first:'よくある質問と回答を10件だけ標準化する',solution_tags:['crm','sales','ai']},field:{id:'field',label:'現場・移動',free_first:'移動・待ち・記録のどこで時間を失っているか1週間だけ記録する',solution_tags:['mobile','physical','workflow']},teaching:{id:'teaching',label:'教育・引き継ぎ',free_first:'質問される内容をFAQ化し、最初の10項目だけ共通知識にする',solution_tags:['knowledge','training','ai']},creative:{id:'creative',label:'制作・クリエイティブ',free_first:'企画・素材・仕上げを分け、最も時間がかかる工程だけAI化候補にする',solution_tags:['creative','ai','workflow']},technical:{id:'technical',label:'IT・開発',free_first:'定型調査・変更・検証を分け、検証条件を先に自動化する',solution_tags:['coding','devops','ai']},management:{id:'management',label:'管理・意思決定',free_first:'判断待ちを一覧化し、誰が・何を・いつ決めるかだけ固定する',solution_tags:['management','decision','ai']},other:{id:'other',label:'未言語化',free_first:'今日やった仕事を30分単位で3日だけ記録し、時間を使った上位3作業を見つける',solution_tags:['discovery','workflow']}};const labels={free:'0円',ai_saas:'AI / SaaS',physical:'物理改善',service:'専門支援'};function ev(name,data={}){try{const l=JSON.parse(localStorage.getItem('mvp_events')||'[]');l.push({name,at:new Date().toISOString(),...data});localStorage.setItem('mvp_events',JSON.stringify(l))}catch(e){}}function render(){const p=patterns[pattern.value],r=WorkPatternEngine.recommend(p,budget.value);patternTag.textContent=p.label;free.textContent=p.free_first;const paid=r.recommendations.filter(x=>x.kind!=='free');recommendations.innerHTML=paid.length?'<h3>無料改善で足りない場合だけ</h3>'+paid.map(x=>`<div class="rec"><span class="tag">${labels[x.kind]||x.kind}</span><h3>${x.name}</h3><p>仕事構造との適合を優先して候補化。想定追加費用の上限目安：${x.cost.toLocaleString()}円。</p></div>`).join(''):'<h3>購入判断</h3><p><strong>今回は何も買わないことを推奨します。</strong> まず上の0円改善を試してください。</p>';policy.textContent='推薦方針：仕事構造との適合を優先。職種やアフィリエイト報酬額はランキングの主キーにしません。';form.style.display='none';result.style.display='block';result.focus();ev('diagnosis_complete',{pattern:p.id,budget:budget.value,decision:r.decision,recommendations:r.recommendations.map(x=>x.id)})}diagnose.addEventListener('click',()=>{ev('diagnosis_start',{pattern:pattern.value});render()});reset.addEventListener('click',()=>{result.style.display='none';form.style.display='block'});ev('page_view');</script></body></html>
